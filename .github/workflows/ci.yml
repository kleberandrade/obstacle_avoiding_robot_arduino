name: Validate line follower
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make test example
  uno:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: arduino/setup-arduino-cli@v2.0.0
        with:
          version: '1.6.0'
      - run: make firmware
