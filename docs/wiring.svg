<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<title>Uno R3 line follower — original wiring schematic</title>
<desc>Net-labelled wiring for three QTR-1A sensors and a Pololu DRV8833 carrier with separate USB logic power and switched NiMH motor power. All GND labels join the same ground.</desc>
<style>text{font-family:Arial,sans-serif;fill:#14283c;font-size:18px}.title{font-size:28px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:16px}.wire{stroke:#176477;stroke-width:2;fill:none}.box{fill:#f1f6fa;stroke:#52677d;stroke-width:2}</style>
<rect width="1200" height="1200" fill="white"/>
<text x="35" y="45" class="title">Arduino line follower — net-labelled wiring</text>
<text x="35" y="76">Same label = same electrical net. Pin names, not header positions.</text>
<rect class="box" x="35" y="110" width="535" height="459" rx="8"/><text class="head" x="53" y="144">Arduino Uno R3</text><text x="53" y="180">USB-B</text><path class="wire" d="M180,174 h32"/><text x="225" y="180">USB 5 V supply</text><text x="53" y="212">5V</text><path class="wire" d="M180,206 h32"/><text x="225" y="212">SENSOR_5V</text><text x="53" y="244">GND</text><path class="wire" d="M180,238 h32"/><text x="225" y="244">GND</text><text x="53" y="276">A0</text><path class="wire" d="M180,270 h32"/><text x="225" y="276">LEFT_OUT</text><text x="53" y="308">A1</text><path class="wire" d="M180,302 h32"/><text x="225" y="308">CENTER_OUT</text><text x="53" y="340">A2</text><path class="wire" d="M180,334 h32"/><text x="225" y="340">RIGHT_OUT</text><text x="53" y="372">D5 / PWM</text><path class="wire" d="M180,366 h32"/><text x="225" y="372">AIN1</text><text x="53" y="404">D4 / LOW</text><path class="wire" d="M180,398 h32"/><text x="225" y="404">AIN2</text><text x="53" y="436">D6 / PWM</text><path class="wire" d="M180,430 h32"/><text x="225" y="436">BIN1</text><text x="53" y="468">D7 / LOW</text><path class="wire" d="M180,462 h32"/><text x="225" y="468">BIN2</text><text x="53" y="500">D8</text><path class="wire" d="M180,494 h32"/><text x="225" y="500">SLP</text><text x="53" y="532">D2 / pull-up</text><path class="wire" d="M180,526 h32"/><text x="225" y="532">FLT</text><rect class="box" x="620" y="110" width="545" height="427" rx="8"/><text class="head" x="638" y="144">Pololu DRV8833 #2130</text><text x="638" y="180">VIN</text><path class="wire" d="M765,174 h32"/><text x="810" y="180">MOTOR_V+</text><text x="638" y="212">GND</text><path class="wire" d="M765,206 h32"/><text x="810" y="212">GND</text><text x="638" y="244">AIN1</text><path class="wire" d="M765,238 h32"/><text x="810" y="244">AIN1 (Uno D5)</text><text x="638" y="276">AIN2</text><path class="wire" d="M765,270 h32"/><text x="810" y="276">AIN2 (Uno D4)</text><text x="638" y="308">BIN1</text><path class="wire" d="M765,302 h32"/><text x="810" y="308">BIN1 (Uno D6)</text><text x="638" y="340">BIN2</text><path class="wire" d="M765,334 h32"/><text x="810" y="340">BIN2 (Uno D7)</text><text x="638" y="372">SLP</text><path class="wire" d="M765,366 h32"/><text x="810" y="372">SLP (Uno D8)</text><text x="638" y="404">FLT</text><path class="wire" d="M765,398 h32"/><text x="810" y="404">FLT (Uno D2)</text><text x="638" y="436">AOUT1/2</text><path class="wire" d="M765,430 h32"/><text x="810" y="436">LEFT MOTOR pair</text><text x="638" y="468">BOUT1/2</text><path class="wire" d="M765,462 h32"/><text x="810" y="468">RIGHT MOTOR pair</text><text x="638" y="500">VMM / ISEN</text><path class="wire" d="M765,494 h32"/><text x="810" y="500">No external connection</text><rect class="box" x="35" y="600" width="535" height="235" rx="8"/><text class="head" x="53" y="634">Three QTR-1A sensors</text><text x="53" y="670">All VIN</text><path class="wire" d="M180,664 h32"/><text x="225" y="670">SENSOR_5V</text><text x="53" y="702">All GND</text><path class="wire" d="M180,696 h32"/><text x="225" y="702">GND</text><text x="53" y="734">Left OUT</text><path class="wire" d="M180,728 h32"/><text x="225" y="734">LEFT_OUT → Uno A0</text><text x="53" y="766">Center OUT</text><path class="wire" d="M180,760 h32"/><text x="225" y="766">CENTER_OUT → Uno A1</text><text x="53" y="798">Right OUT</text><path class="wire" d="M180,792 h32"/><text x="225" y="798">RIGHT_OUT → Uno A2</text><rect class="box" x="620" y="600" width="545" height="300" rx="8"/>
<text x="638" y="634" class="head">Power, sleep and suppression</text>
<text x="638" y="670">4 × NiMH + → 1 A fuse → switch → MOTOR_V+</text>
<text x="638" y="704">Pack − → GND (common with Uno / sensors)</text>
<text x="638" y="738">100 µF / 16 V: + to MOTOR_V+, − to GND</text>
<text x="638" y="772">SLP → 10 kΩ → GND (reset-time sleep)</text>
<text x="638" y="806">100 nF across EACH motor's terminals</text>
<text x="638" y="840">Battery pack: 4.8 V nominal; verify &lt;6 V</text>
<text x="638" y="876" class="small">Motor return goes directly to driver / battery ground.</text>
<text x="35" y="870" class="head">Sensor orientation</text>
<text x="35" y="901">Left — Center — Right, looking forward</text>
<text x="35" y="932">Faces down, ~3 mm above track</text>
<text x="35" y="979" class="head">Never connect motor power to Uno 5V, VIN or GPIO.</text>
<text x="35" y="1013" class="small">Original diagram · MIT · See HARDWARE.md for assembly, current limits and commissioning.</text>
</svg>